<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            font-size: 16px;
            line-height: 1.6;
            color: #c9d1d9;
            background: #0d1117;
            max-width: 980px;
            margin: 0 auto;
            padding: 32px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 600;
            line-height: 1.25;
            color: #e6edf3;
            margin-top: 24px;
            margin-bottom: 16px;
        }

        h1 { font-size: 2em; padding-bottom: 0.3em; border-bottom: 1px solid #21262d; }
        h2 { font-size: 1.5em; padding-bottom: 0.3em; border-bottom: 1px solid #21262d; }
        h3 { font-size: 1.25em; }
        h4 { font-size: 1em; }

        p { margin-top: 0; margin-bottom: 16px; }

        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        strong { font-weight: 600; color: #e6edf3; }

        img { max-width: 100%; height: auto; border-radius: 6px; }

        code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 85%;
            padding: 0.2em 0.4em;
            background: rgba(110, 118, 129, 0.2);
            border-radius: 6px;
            color: #e6edf3;
        }

        pre {
            padding: 16px;
            overflow: auto;
            font-size: 85%;
            line-height: 1.45;
            background: #161b22;
            border-radius: 6px;
            border: 1px solid #30363d;
            margin-bottom: 16px;
        }

        pre code {
            display: inline;
            padding: 0;
            margin: 0;
            background: transparent;
            border: 0;
            font-size: 100%;
            color: #e6edf3;
        }

        blockquote {
            padding: 0 1em;
            color: #8b949e;
            border-left: 0.25em solid #3b434b;
            margin: 0 0 16px 0;
        }

        blockquote > :first-child { margin-top: 0; }
        blockquote > :last-child { margin-bottom: 0; }

        ul, ol { padding-left: 2em; margin-top: 0; margin-bottom: 16px; }
        li + li { margin-top: 0.25em; }

        .task-list { list-style-type: none; padding-left: 0; }
        .task-list-item { display: flex; align-items: flex-start; gap: 0.5em; }
        .task-list-item input[type="checkbox"] { margin-top: 0.3em; accent-color: #58a6ff; }

        table {
            border-spacing: 0;
            border-collapse: collapse;
            margin-bottom: 16px;
            width: auto;
        }

        table th, table td {
            padding: 6px 13px;
            border: 1px solid #30363d;
        }

        table th {
            font-weight: 600;
            background: #161b22;
        }

        table tr { background: #0d1117; }
        table tr:nth-child(2n) { background: #161b22; }

        hr {
            height: 0.25em;
            padding: 0;
            margin: 24px 0;
            background-color: #21262d;
            border: 0;
            border-radius: 2px;
        }

        .footnotes {
            font-size: 0.875em;
            color: #8b949e;
        }

        .footnotes ol { padding-left: 1.5em; }
        .footnotes a { color: #58a6ff; }

        /* Selection color */
        ::selection { background: rgba(88, 166, 255, 0.3); }
    </style>
</head>
<body>
    <article class="markdown-body">
        {{content}}
    </article>
</body>
</html>
