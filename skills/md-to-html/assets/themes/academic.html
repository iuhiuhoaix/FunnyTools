<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
            font-size: 11.5pt;
            line-height: 1.6;
            color: #1a1a1a;
            background: #fff;
            max-width: 720px;
            margin: 0 auto;
            padding: 40px 30px;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
            font-weight: bold;
            color: #000;
            margin-top: 1.8em;
            margin-bottom: 0.6em;
        }

        h1 {
            font-size: 1.8em;
            text-align: center;
            margin-top: 2.5em;
            margin-bottom: 0.3em;
            border-bottom: none;
        }

        h2 {
            font-size: 1.3em;
            border-bottom: 1px solid #999;
            padding-bottom: 0.2em;
        }

        h3 { font-size: 1.1em; font-style: italic; }
        h4 { font-size: 1em; }

        p { margin-top: 0; margin-bottom: 1em; text-align: justify; hyphens: auto; }

        a { color: #333; text-decoration: underline; }

        strong { font-weight: bold; }
        em { font-style: italic; }

        img { max-width: 100%; height: auto; display: block; margin: 1em auto; }

        code {
            font-family: "Courier New", Courier, monospace;
            font-size: 0.9em;
            padding: 0.1em 0.3em;
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 2px;
        }

        pre {
            padding: 1em;
            overflow: auto;
            font-size: 0.85em;
            line-height: 1.5;
            background: #f8f8f8;
            border: 1px solid #ddd;
            margin-bottom: 1.2em;
        }

        pre code {
            display: inline;
            padding: 0;
            background: transparent;
            border: none;
        }

        blockquote {
            margin: 1em 0;
            padding: 0.5em 1.5em;
            border-left: 2px solid #666;
            color: #444;
            font-style: italic;
            background: #fafafa;
        }

        blockquote > :first-child { margin-top: 0; }
        blockquote > :last-child { margin-bottom: 0; }

        ul, ol {
            padding-left: 2em;
            margin-bottom: 1em;
        }

        li { margin-bottom: 0.2em; }

        .task-list {
            list-style-type: none;
            padding-left: 0;
        }

        .task-list-item { display: flex; align-items: flex-start; gap: 0.5em; }
        .task-list-item input[type="checkbox"] { margin-top: 0.3em; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.2em;
            font-size: 0.95em;
        }

        table th, table td {
            padding: 0.4em 0.8em;
            border: 1px solid #ccc;
        }

        table th {
            font-weight: bold;
            background: #f0f0f0;
        }

        hr {
            border: none;
            border-top: 1px solid #999;
            margin: 2em 0;
        }

        /* Section numbering for h2 */
        body { counter-reset: section; }
        h2 { counter-increment: section; }
        h2::before { content: counter(section) ". "; font-weight: normal; }

        .footnotes {
            font-size: 0.85em;
            color: #666;
            margin-top: 2em;
        }

        .footnotes ol { padding-left: 1.5em; }
        .footnotes a { color: #333; }

        @media print {
            body { font-size: 11pt; max-width: none; padding: 0; }
            a { color: #000; }
            pre, blockquote { page-break-inside: avoid; }
        }
    </style>
</head>
<body>
    <article class="markdown-body">
        {{content}}
    </article>
</body>
</html>
