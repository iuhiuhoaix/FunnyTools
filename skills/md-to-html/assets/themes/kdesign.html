<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>

    <!-- Prism.js 代码高亮 (本地) -->
    <link rel="stylesheet" href="../vendor/prism/prism-tomorrow.min.css">
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
            color: #333;
            background: #f5f6fa;
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 30px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 600;
            color: #1a1a2e;
            margin-top: 1.5em;
            margin-bottom: 0.75em;
        }

        h1 {
            font-size: 1.75em;
            text-align: center;
            margin-top: 1em;
            padding-bottom: 0.5em;
            border-bottom: 2px solid #306eff;
            color: #306eff;
        }

        h2 {
            font-size: 1.375em;
            padding-bottom: 0.25em;
            border-bottom: 1px solid #e8e8e8;
            color: #306eff;
        }

        h3 { font-size: 1.125em; color: #444; }
        h4 { font-size: 1em; color: #555; text-transform: uppercase; letter-spacing: 0.05em; font-size: 0.875em; }

        p { margin-top: 0; margin-bottom: 1em; }

        a {
            color: #306eff;
            text-decoration: none;
            transition: color 0.2s cubic-bezier(0.645, 0.045, 0.355, 1);
        }
        a:hover {
            color: #4a80ff;
            text-decoration: underline;
        }

        strong { font-weight: 600; }

        img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        code {
            font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
            font-size: 0.875em;
            padding: 0.125em 0.375em;
            background: #f2f3f4;
            border-radius: 4px;
            color: #306eff;
        }

        pre {
            padding: 1.25em;
            overflow: auto;
            font-size: 0.875em;
            line-height: 1.5;
            background: #282c34;
            color: #abb2bf;
            border-radius: 6px;
            margin-bottom: 1.5em;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
        }

        pre code {
            display: inline;
            padding: 0;
            background: transparent;
            color: inherit;
        }

        blockquote {
            margin: 1.5em 0;
            padding: 1em 1.25em;
            border-left: 4px solid #306eff;
            background: #f0f4ff;
            color: #555;
            border-radius: 0 6px 6px 0;
        }

        blockquote > :first-child { margin-top: 0; }
        blockquote > :last-child { margin-bottom: 0; }

        ul, ol { padding-left: 2em; margin-bottom: 1em; }
        li { margin-bottom: 0.25em; }

        .task-list { list-style-type: none; padding-left: 0; }
        .task-list-item { display: flex; align-items: flex-start; gap: 0.5em; }
        .task-list-item input[type="checkbox"] { margin-top: 0.3em; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.5em;
            background: #fff;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            border-radius: 6px;
            overflow: hidden;
        }

        table th, table td {
            padding: 0.75em 1em;
            border-bottom: 1px solid #e8e8e8;
            text-align: left;
        }

        table th {
            font-weight: 600;
            background: #306eff;
            color: #fff;
        }

        table tr:last-child td { border-bottom: none; }
        table tr:hover { background: #f8f9ff; }

        hr {
            border: none;
            border-top: 1px solid #e8e8e8;
            margin: 2em 0;
        }

        .footnotes {
            font-size: 0.875em;
            color: #888;
            margin-top: 3em;
            padding-top: 1em;
            border-top: 1px solid #e8e8e8;
        }

        .footnotes ol { padding-left: 1.5em; }
        .footnotes a { color: #306eff; }

        /* Mermaid diagram styles */
        .mermaid {
            background: #fff;
            border-radius: 6px;
            padding: 1.5em;
            margin-bottom: 1.5em;
            box-shadow: 0 4px 16px rgba(0,0,0,0.1);
            overflow-x: auto;
            text-align: center;
        }

        .mermaid svg {
            max-width: 100%;
            height: auto;
        }

        @media print {
            body { background: #fff; max-width: none; padding: 0; font-size: 11pt; }
            pre { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
            table th { background: #f0f0f0; color: #333; }
            h1 { border-bottom-width: 2px; }
        }
    </style>
</head>
<body>
    <article class="markdown-body">
        {{content}}
    </article>

    <!-- Prism.js 代码高亮 (本地) -->
    <script src="../vendor/prism/prism.min.js"></script>
    <script src="../vendor/prism/prism-javascript.min.js"></script>
    <script src="../vendor/prism/prism-python.min.js"></script>
    <script src="../vendor/prism/prism-sql.min.js"></script>
    <script src="../vendor/prism/prism-css.min.js"></script>
    <script src="../vendor/prism/prism-markup.min.js"></script>
    <script src="../vendor/prism/prism-json.min.js"></script>
    <script src="../vendor/prism/prism-bash.min.js"></script>
    <script>
        // 高亮所有代码块
        Prism.highlightAll();
    </script>

    <script>
        // Show error if mermaid fails to load
        function showMermaidError() {
            document.querySelectorAll('code.language-mermaid').forEach(function(block) {
                var pre = block.parentElement;
                var errorDiv = document.createElement('div');
                errorDiv.style.cssText = 'background:#fff3cd;border:1px solid #ffc107;padding:12px;border-radius:6px;margin:10px 0;color:#856404;font-size:14px;';
                errorDiv.innerHTML = '⚠️ Mermaid 加载失败，请检查网络连接或使用 VPN';
                pre.parentElement.insertBefore(errorDiv, pre);
            });
        }

        // First, wrap mermaid code blocks in containers
        document.querySelectorAll('code.language-mermaid').forEach(function(block) {
            var container = document.createElement('div');
            container.className = 'mermaid';
            var pre = block.parentElement;
            pre.parentElement.insertBefore(container, pre);
            container.textContent = block.textContent;
            pre.remove();
        });

        // Load mermaid (本地)
        var script = document.createElement('script');
        script.src = '../vendor/mermaid/mermaid.min.js';
        script.onload = function() {
            mermaid.initialize({
                startOnLoad: false,
                theme: 'base',
                themeVariables: {
                    // KDesign 蓝色主色
                    primaryColor: '#306eff',
                    primaryTextColor: '#fff',
                    primaryBorderColor: '#175cff',

                    // 次要色（浅蓝背景）
                    secondaryColor: '#f0f4ff',
                    tertiaryColor: '#f8f9ff',

                    // 线条
                    lineColor: '#306eff',
                    edgeLabelBackground: '#fff',
                    edgeTextColor: '#333',

                    // 节点文本 - 白色
                    nodeTextColor: '#fff',

                    // 背景
                    background: '#fff',
                    mainBkg: '#306eff',
                    nodeBorder: '#175cff',

                    // 信道/激活色
                    activationBkgColor: '#f0f4ff',
                    activationBorderColor: '#306eff',

                    // 序列图
                    actorBkg: '#306eff',
                    actorBorder: '#175cff',
                    actorTextColor: '#fff',
                    signalColor: '#333',
                    signalTextColor: '#333',

                    // 流程图
                    fillType0: '#306eff',
                    fillType1: '#4a80ff',
                    fillType2: '#f0f4ff'
                },
                flowchart: {
                    useMaxWidth: true,
                    htmlLabels: true,
                    curve: 'basis',
                    nodeSpacing: 50,
                    rankSpacing: 60
                },
                sequence: {
                    useMaxWidth: true,
                    actorMargin: 50
                },
                securityLevel: 'loose',
                fontSize: 14
            });

            // 自定义样式：小圆角 + 粗线条
            var style = document.createElement('style');
            style.textContent = `
                .mermaid .node rect,
                .mermaid .node polygon,
                .mermaid .node circle {
                    rx: 4;
                    ry: 4;
                }
                .mermaid .edgePath path {
                    stroke-width: 2.5px;
                }
                .mermaid .edgeLabel {
                    font-size: 13px;
                    background-color: #fff;
                    color: #333 !important;
                }
                .mermaid .nodeLabel {
                    font-size: 14px;
                    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
                }
            `;
            document.head.appendChild(style);

            mermaid.run();
            console.log('Mermaid loaded successfully');
        };
        script.onerror = function() {
            showMermaidError();
        };
        document.body.appendChild(script);
    </script>
</body>
</html>
